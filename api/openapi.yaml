openapi: 3.0.3
info:
  title: IDP Studio API
  version: 1.0.0
  description: >
    Single API contract for Intelligent Document Processing (IDP) of insurance
    broker / underwriting documents. The SAME contract is implemented by two
    interchangeable backends:
      * AWS  — API Gateway (HTTP) + Lambda + Bedrock / Textract / Comprehend /
               Comprehend Medical / S3
      * Azure — API Management + Functions + Document Intelligence / Azure OpenAI / Blob
    The frontend (static SPA on GitHub Pages) talks only to this contract, so you
    can point it at either cloud by changing the API base URL.

    PII/PHI masking in the agentic pipelines uses Amazon Comprehend
    (DetectPiiEntities) and Amazon Comprehend Medical (DetectPHI) — existing
    managed models, no training. The "bring-your-own-LLM" flow (prepare +
    extract) masks with reversible tokens, sends only masked text to the chosen
    external LLM, then un-masks the result so the final output has real values.
servers:
  - url: https://{apiId}.execute-api.{region}.amazonaws.com/{stage}
    description: AWS API Gateway
    variables:
      apiId:  { default: REPLACE_ME }
      region: { default: eu-west-1 }
      stage:  { default: prod }
  - url: https://{apimName}.azure-api.net/idp
    description: Azure API Management
    variables:
      apimName: { default: REPLACE_ME }

security:
  - ApiKeyAuth: []

paths:
  /v1/extract/bedrock:
    post:
      summary: Extract a document directly with a Bedrock foundation model
      operationId: extractBedrock
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BedrockRequest' }
      responses:
        '200': { description: Extraction result, content: { application/json: { schema: { $ref: '#/components/schemas/ExtractResult' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '500': { $ref: '#/components/responses/ServerError' }

  /v1/extract/textract:
    post:
      summary: Extract a document with AWS Textract, then map to target schema
      operationId: extractTextract
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TextractRequest' }
      responses:
        '200': { description: Raw + mapped result, content: { application/json: { schema: { $ref: '#/components/schemas/TextractResult' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '500': { $ref: '#/components/responses/ServerError' }

  /v1/extract/azure:
    post:
      summary: Extract with Azure Document Intelligence, then map with Azure OpenAI
      operationId: extractAzure
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AzureRequest' }
      responses:
        '200': { description: Extraction result, content: { application/json: { schema: { $ref: '#/components/schemas/ExtractResult' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '500': { $ref: '#/components/responses/ServerError' }

  /v1/agents/run:
    post:
      summary: Run the multi-agent pipeline (ingest → OCR → PII mask → extract → validate)
      operationId: runAgents
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AgentsRequest' }
      responses:
        '200': { description: Per-agent steps + final result, content: { application/json: { schema: { $ref: '#/components/schemas/AgentsResult' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '500': { $ref: '#/components/responses/ServerError' }

  /v1/agents/prepare:
    post:
      summary: "Bring-your-own-LLM, stage 1: ingest → Textract OCR → Comprehend PII/PHI mask (reversible tokens)"
      description: >
        Runs the AWS-only steps and stores the reversible {ocr, masked, mask_map}
        context in S3 under the returned run_id (expires with the input bucket).
        Returns the original OCR key/values (for display/copy) and the masked
        key/values (with [PII_n] tokens). No LLM is called here.
      operationId: agentsPrepare
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PrepareRequest' }
      responses:
        '200': { description: OCR + masked output + run_id, content: { application/json: { schema: { $ref: '#/components/schemas/PrepareResult' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '500': { $ref: '#/components/responses/ServerError' }

  /v1/agents/extract:
    post:
      summary: "Bring-your-own-LLM, stage 2: extract via your LLM on masked data → unmask → validate"
      description: >
        Loads the masked data + mask_map by run_id, sends only masked values to
        the caller-supplied external LLM with the (optional) prompt, then
        un-masks the result so the final JSON contains real values. The external
        API key is used server-side only and never logged.
      operationId: agentsExtract
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ExtractRequest' }
      responses:
        '200': { description: Steps + masked_result + unmasked result, content: { application/json: { schema: { $ref: '#/components/schemas/ExtractResult2' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { description: No prepared data for run_id (expired), content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '500': { $ref: '#/components/responses/ServerError' }

  /v1/agents/run-external:
    post:
      summary: "Bring-your-own-LLM, one-shot: all 6 steps (ingest → OCR → mask → your LLM → unmask → finalize)"
      operationId: runAgentsExternal
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RunExternalRequest' }
      responses:
        '200': { description: Per-agent steps + unmasked result, content: { application/json: { schema: { $ref: '#/components/schemas/ExtractResult2' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '500': { $ref: '#/components/responses/ServerError' }

  /v1/logs:
    get:
      summary: List processing log entries stored in S3 (or Azure Blob)
      operationId: listLogs
      parameters:
        - { name: capability, in: query, required: false, schema: { type: string, enum: [bedrock, textract, agents, agents-external, prepare, azure] } }
        - { name: limit, in: query, required: false, schema: { type: integer, default: 50, maximum: 200 } }
      responses:
        '200': { description: Log list, content: { application/json: { schema: { $ref: '#/components/schemas/LogList' } } } }

  /v1/stats:
    get:
      summary: Per-document PII/PHI masking stats + aggregate (powers the dashboard)
      description: >
        Reads the per-document stat objects written to s3://<logs-bucket>/pii-stats/
        by the agentic pipelines and returns them plus a precomputed aggregate.
        Each doc records fields masked vs total, char coverage, PII/PHI entity
        counts, and a by_source breakdown (comprehend_pii / comprehend_phi /
        key_heuristic / regex) so you can see which layer caught each entity.
      operationId: listStats
      parameters:
        - { name: limit, in: query, required: false, schema: { type: integer, default: 500, maximum: 1000 } }
      responses:
        '200': { description: Aggregate + per-doc items, content: { application/json: { schema: { $ref: '#/components/schemas/StatsResult' } } } }

components:
  securitySchemes:
    ApiKeyAuth: { type: apiKey, in: header, name: x-api-key }

  responses:
    BadRequest:  { description: Invalid input, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    ServerError: { description: Processing failure, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }

  schemas:
    BaseRequest:
      type: object
      required: [document_base64, target_schema]
      properties:
        filename:        { type: string, example: broker_application.pdf }
        document_base64: { type: string, description: Base64-encoded PDF bytes }
        target_schema:   { type: string, description: Desired output as a JSON string (object or JSON Schema) }
        mask_pii:        { type: boolean, default: true, description: Mask PII before writing logs }
        bedrock_api_key: { type: string, description: "Optional Bedrock API key (bearer token). If supplied, the backend authenticates to Bedrock with this token (AWS_BEARER_TOKEN_BEDROCK) instead of its IAM role. Overrides any baked-in key. Never logged." }

    BedrockRequest:
      allOf:
        - $ref: '#/components/schemas/BaseRequest'
        - type: object
          properties:
            model: { type: string, example: "us.anthropic.claude-haiku-4-5-20251001-v1:0" }

    TextractRequest:
      allOf:
        - $ref: '#/components/schemas/BaseRequest'
        - type: object
          properties:
            feature_types:
              type: array
              items: { type: string, enum: [FORMS, TABLES, QUERIES, SIGNATURES] }
              default: [FORMS, TABLES]

    AzureRequest:
      allOf:
        - $ref: '#/components/schemas/BaseRequest'
        - type: object
          properties:
            model:      { type: string, example: prebuilt-layout }
            deployment: { type: string, example: gpt-4o-mapping }

    AgentsRequest:
      allOf:
        - $ref: '#/components/schemas/BaseRequest'
        - type: object
          properties:
            detect_phi: { type: boolean, default: true, description: "Also detect PHI via Amazon Comprehend Medical (extra cost). Uncheck for PII-only via Amazon Comprehend." }

    LlmConfig:
      type: object
      required: [provider, api_key, model]
      properties:
        provider: { type: string, enum: [google, anthropic, openai], description: "External LLM provider. 'openai' covers any OpenAI-compatible endpoint." }
        api_key:  { type: string, description: "Your provider API key. Used server-side only; never stored or logged." }
        model:    { type: string, example: gemini-2.5-flash }
        base_url: { type: string, example: https://api.openai.com/v1, description: "Only for provider=openai (OpenAI / Groq / OpenRouter / …)." }

    PrepareRequest:
      type: object
      required: [document_base64]
      properties:
        filename:        { type: string }
        document_base64: { type: string, description: Base64-encoded PDF bytes }
        detect_phi:      { type: boolean, default: true }

    PrepareResult:
      type: object
      properties:
        run_id:           { type: string, description: Use this in /v1/agents/extract }
        status:           { type: string }
        steps:            { type: array, items: { $ref: '#/components/schemas/AgentStep' } }
        ocr_keyvalues:    { type: object, description: Original Textract key/values (for display/copy) }
        masked_keyvalues: { type: object, description: Key/values with reversible [PII_n] tokens (what the LLM will receive) }
        entities:         { type: object, description: "Counts + types: { pii, phi, types, tokens }" }

    ExtractRequest:
      type: object
      required: [run_id, llm]
      properties:
        run_id:        { type: string, description: From /v1/agents/prepare }
        target_schema: { type: string }
        prompt:        { type: string, description: "Optional. Defaults to an insurance-underwriting prompt; the schema + masked data are appended automatically. Must instruct the model to preserve [PII_n] tokens." }
        llm:           { $ref: '#/components/schemas/LlmConfig' }

    ExtractResult2:
      type: object
      properties:
        run_id:        { type: string }
        capability:    { type: string, example: agents-external }
        status:        { type: string, enum: [succeeded, failed_at_extract] }
        latency_ms:    { type: integer }
        steps:         { type: array, items: { $ref: '#/components/schemas/AgentStep' } }
        masked_result: { type: object, description: "The LLM's raw output (still contains [PII_n] tokens) — shown for transparency" }
        result:        { type: object, description: "Final UNMASKED result — tokens replaced with the original values" }
        final:         { type: object, description: "{ target_json, provider, model, valid, missing_required }" }
        s3_key:        { type: string }

    RunExternalRequest:
      allOf:
        - $ref: '#/components/schemas/BaseRequest'
        - type: object
          required: [llm]
          properties:
            detect_phi: { type: boolean, default: true }
            prompt:     { type: string }
            llm:        { $ref: '#/components/schemas/LlmConfig' }

    ExtractResult:
      type: object
      properties:
        run_id:      { type: string }
        capability:  { type: string }
        model:       { type: string }
        status:      { type: string, enum: [succeeded, failed] }
        latency_ms:  { type: integer }
        s3_key:      { type: string }
        result:      { type: object, description: The document mapped to the target schema }

    TextractResult:
      allOf:
        - $ref: '#/components/schemas/ExtractResult'
        - type: object
          properties:
            raw_keyvalues: { type: object, description: Raw Textract key/value pairs and table summaries }

    AgentStep:
      type: object
      properties:
        id:     { type: string }
        title:  { type: string }
        icon:   { type: string }
        svc:    { type: string }
        input:  { type: object }
        output: { type: object }

    AgentsResult:
      allOf:
        - $ref: '#/components/schemas/ExtractResult'
        - type: object
          properties:
            steps: { type: array, items: { $ref: '#/components/schemas/AgentStep' } }

    LogEntry:
      type: object
      properties:
        timestamp:  { type: string, format: date-time }
        run_id:     { type: string }
        capability: { type: string }
        model:      { type: string }
        status:     { type: string }
        latency_ms: { type: integer }
        s3_key:     { type: string }
        detail:     { type: object }

    LogList:
      type: object
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/LogEntry' } }

    PiiStat:
      type: object
      description: Per-document PII/PHI masking stats (s3://logs/pii-stats/)
      properties:
        run_id:            { type: string }
        timestamp:         { type: string, format: date-time }
        capability:        { type: string, enum: [agents, agents-external, prepare] }
        filename:          { type: string }
        detect_phi:        { type: boolean }
        engine:            { type: string }
        fields_total:      { type: integer }
        fields_masked:     { type: integer }
        fields_unmasked:   { type: integer }
        coverage_pct:      { type: number }
        chars_total:       { type: integer }
        chars_masked:      { type: integer }
        char_coverage_pct: { type: number }
        entities_masked:   { type: integer }
        pii_entities:      { type: integer }
        phi_entities:      { type: integer }
        by_source:         { type: object, description: "counts keyed by comprehend_pii | comprehend_phi | key_heuristic | regex" }
        by_type:           { type: object, description: "counts keyed by entity type (NAME, EMAIL, PHI_DATE, …)" }
        ocr_masked:        { type: object, description: "masked OCR key/values (tokens/labels — never raw PII)" }

    StatsResult:
      type: object
      properties:
        aggregate: { type: object, description: "summed metrics across all docs + by_source / by_type / by_capability" }
        items:     { type: array, items: { $ref: '#/components/schemas/PiiStat' } }

    Error:
      type: object
      properties:
        error:   { type: string }
        message: { type: string }
        run_id:  { type: string }
